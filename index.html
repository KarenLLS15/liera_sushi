<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liera Sushi - Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="card" style="max-width:480px;margin:20px auto;padding:32px">
      <div class="header center" style="flex-direction:column">
        <img src="../imagenes/logo.jpg" alt="Logo Liera Sushi" class="logo">
        <h1 class="h-title">Liera Sushi</h1>
        <h2 style="margin-top:8px">Iniciar Sesión</h2>
      </div>

      <form onsubmit="(function(e){e.preventDefault(); location.href='menu.html'})()">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="login-user" placeholder="usuario" required />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="login-pass" placeholder="contraseña" required />
        </div>
        <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px">
          <button class="btn btn-primary" style="width:100%">Iniciar Sesión</button>
        </div>
      </form>

      <div class="center small" style="margin-top:12px">
        <a href="#" onclick="alert('Función de recuperar contraseña demo')">Recuperar contraseña</a>
      </div>
    </div>
  </div>
</body>
</html>
